
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Harry Potter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>O Mundo Mágico de Harry Potter</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="galeria.html">Galeria</a>
            <a href="formulario.html">Formulário</a>
        </nav>
    </header>

    <main>
        <h2>Faça parte do mundo mágico!</h2>
        <p>Responda às perguntas sobre Harry Potter.</p>

        <form action="https://formsubmit.co/" method="POST">

            <label for="nome">Seu nome:</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome" required>

            <label for="casa">Qual é sua casa de Hogwarts?</label>
            <select id="casa" name="casa" required>
                <option value="">Escolha sua casa</option>
                <option value="Grifinória">Grifinória</option>
                <option value="Sonserina">Sonserina</option>
                <option value="Corvinal">Corvinal</option>
                <option value="Lufa-Lufa">Lufa-Lufa</option>
            </select>

            <label for="filme">Qual é seu filme favorito?</label>
            <input type="text" id="filme" name="filme"
                   placeholder="Digite o nome do filme" required>

            <label for="personagem">Quem é seu personagem favorito?</label>
            <input type="text" id="personagem" name="personagem"
                   placeholder="Digite o personagem" required>

            <label for="opiniao">O que você mais gosta na saga?</label>
            <textarea id="opiniao" name="opiniao"
                      rows="5" placeholder="Escreva sua resposta..."
                      required></textarea>

            <button type="submit">Enviar respostas</button>

        </form>
    </main>

    <footer>
        <p>O Mundo Mágico de Harry Potter</p>
    </footer>

</body>
</html>
