<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Harry Potter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>O Mundo Mágico de Harry Potter</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="galeria.html">Galeria</a>
            <a href="formulario.html">Contato</a>
        </nav>
    </header>

    <main>
        <h2>Entre em contato conosco!</h2>
        <p>Tem alguma dúvida, sugestão ou mensagem?
           Preencha o formulário abaixo.</p>

        <form id="formContato">

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" required>

            <label for="assunto">Assunto:</label>
            <select id="assunto" name="assunto" required>
                <option value="">Selecione uma opção</option>
                <option value="Dúvida">Dúvida</option>
                <option value="Sugestão">Sugestão</option>
                <option value="Elogio">Elogio</option>
                <option value="Outro">Outro</option>
            </select>

            <label for="mensagem">Sua mensagem:</label>
            <textarea id="mensagem" name="mensagem"
                      rows="6" placeholder="Escreva sua mensagem..."
                      required></textarea>

            <button type="submit">Enviar mensagem</button>

            <p id="retorno"></p>
        </form>
    </main>

    <footer>
        <p>O Mundo Mágico de Harry Potter</p>
    </footer>

    <script>
        document.getElementById("formContato")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("retorno").textContent =
                    "Formulário preenchido com sucesso!";

                this.reset();
            });
    </script>

</body>
</html>
